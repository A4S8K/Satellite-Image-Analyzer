[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-image-analyzer"
version = "0.3.0"
description = "Satellite image analysis with RGB fire evidence and georeferenced Red/NIR NDVI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Satellite Image Analyzer Contributors" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "rasterio>=1.3",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
sat-analyzer = "satellite_analyzer.cli:main"

[tool.setuptools]
# Explicit package mapping uses setuptools' import finder for editable installs.
# This avoids locale-encoded absolute .pth paths on Windows Python 3.12 when a
# checkout directory contains Unicode characters (e.g. emoji).
package-dir = { satellite_analyzer = "src/satellite_analyzer" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satellite_analyzer = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --cov=satellite_analyzer --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["satellite_analyzer"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
